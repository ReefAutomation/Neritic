; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32d

[common]
platform = espressif32@6.12.0
framework = espidf
upload_speed = 115200
monitor_speed = 115200
board_build.esp-idf.sdkconfig_path = sdkconfig
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
extra_scripts = 
	pre:scripts/gen_version.py
	pre:scripts/embed_assets.py
	pre:scripts/link_user_setup.py
	pre:scripts/clean_inc_folder.py
lib_deps = 
build_flags = 
	-DFASTLED_INTERRUPT_RETRY_COUNT=0
	-DCORE_DEBUG_LEVEL=0
	-DSERIAL_BAUD=115200
	-Os

[env:esp32]
platform = ${common.platform}
board = esp32dev
framework = ${common.framework}
lib_compat_mode = off
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DESP32
	-DOTA_ENV=esp32
	-DARDUINO_ARCH_ESP32
	-I${PROJECTSRC_DIR}
	-Os
monitor_speed = ${common.monitor_speed}
board_build.filesystem = littlefs
board_build.partitions = ${common.board_build.partitions}
board_build.flash_size = 4MB
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.4mb
board_upload.flash_size = 4MB
extra_scripts = ${common.extra_scripts}

[env:esp32_debug]
extends = esp32
platform = ${env:esp32.platform}
board = ${env:esp32.board}
framework = ${env:esp32.framework}
lib_compat_mode = off
lib_deps =
	${env:esp32.lib_deps}
build_flags =
	${env:esp32.build_flags}
	-DDEBUG_SERIAL
	-DLOG_LOCAL_LEVEL=ESP_LOG_DEBUG
monitor_speed = ${common.monitor_speed}
board_build.filesystem = littlefs
board_build.partitions = ${common.board_build.partitions}
board_build.flash_size = 4MB
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.4mb.debug
board_upload.flash_size = 4MB
extra_scripts = ${common.extra_scripts}

