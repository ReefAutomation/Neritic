---
name: CI (reusable)

on:
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        default: ''
      run_web:
        type: boolean
        default: true
      run_firmware:
        type: boolean
        default: true
    outputs:
      cache-key:
        description: 'Cache key computed by deps job'
        value: ${{ jobs.deps.outputs.cache-key }}

jobs:
  deps:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.cache-key }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Compute cache key
        id: cache-key
        run: |
          KEY="${{ runner.os }}-deps-${{ hashFiles('package.json','package-lock.json','requirements.txt') }}"
          echo "cache-key=$KEY" >> $GITHUB_OUTPUT
          echo "Computed cache-key: $KEY"

      - name: Restore cache (deps)
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            .venv
            .pio
            ~/.platformio/.cache
            ~/.platformio/lib
            ~/.cache
            ~/.npm
            node_modules
            managed_components
          key: ${{ steps.cache-key.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-deps-


      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Create Python venv
        run: |
          python -m venv .venv

      - name: Activate venv and install PlatformIO
        run: |
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install PlatformIO libraries (explicit)
        run: |
          source .venv/bin/activate
          pio pkg install

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install npm dependencies
        run: |
          npm ci

      - name: Save cache (deps)
        id: cache-save
        uses: actions/cache/save@v5
        with:
          path: |
            .venv
            .pio
            ~/.platformio/.cache
            ~/.platformio/lib
            ~/.cache
            ~/.npm
            node_modules
            managed_components
          key: ${{ steps.cache-key.outputs.cache-key }}

  web:
    if: ${{ inputs.run_web }}
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Restore cache (deps)
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            .venv
            .pio
            ~/.platformio/.cache
            ~/.platformio/lib
            ~/.cache
            ~/.npm
            node_modules
            managed_components
          key: ${{ needs.deps.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Lint web sources
        run: |
          npm run lint

      - name: Build web bundle
        run: |
          npm run build

  firmware:
    if: ${{ inputs.run_firmware }}
    needs: deps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32d, esp32c6, esp32, esp32c3, esp32s3]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          # Full history: scripts/gen_version.py certifies a release build by
          # checking that HEAD is exactly a vX.Y.Z tag reachable from
          # origin/main. A shallow clone cannot answer either question, which
          # would stamp a released firmware as a test build.
          fetch-depth: 0

      - name: Restore cache (deps)
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            .venv
            .pio
            ~/.platformio/.cache
            ~/.platformio/lib
            ~/.cache
            ~/.npm
            node_modules
            managed_components
          key: ${{ needs.deps.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Build firmware for ${{ matrix.env }}
        run: |
          source .venv/bin/activate
          platformio run -e ${{ matrix.env }}
          ls -l ~/.cache ~/.cache/Espressif || true

      - name: Compress firmware binaries
        run: |
            find .pio/build/${{ matrix.env }} -type f -name '*.bin' -exec gzip -k -n {} \;

      - name: Rename .bin.gz files with env and version
        run: |
            VERSION=$(cat VERSION)
            if [[ $VERSION != v* ]]; then
                VERSION="v$VERSION"
            fi
            for f in .pio/build/${{ matrix.env }}/*.bin.gz; do \
                BASE=$(basename "$f" .bin.gz); \
                mv "$f" ".pio/build/${{ matrix.env }}/${BASE}_${{ matrix.env }}_${VERSION}.bin.gz"; \
            done

      - name: Record built environment
        run: echo "${{ matrix.env }}" > built_envs_${{ matrix.env }}.txt

      - name: Upload build artifacts and env file for ${{ matrix.env }}
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.env }}
          path: |
              .pio/build/${{ matrix.env }}/*.bin.gz
              built_envs_${{ matrix.env }}.txt

  # The deps cache is scoped to this run only: `deps` saves it, `web`/`firmware`
  # restore it, and it is deleted once they are done, so a later run can never
  # inherit a stale toolchain or dependency tree. Depending on every consumer is
  # deliberate — the deletion must not race the restores above.
  cache-cleanup:
    name: Clear deps cache
    needs: [deps, web, firmware]
    if: ${{ always() && needs.deps.outputs.cache-key != '' }}
    runs-on: ubuntu-latest
    # Deleting an Actions cache requires the `actions: write` scope, and a
    # caller workflow that grants nothing would cap this job at
    # `actions: none`, failing the cleanup with a permissions error.
    permissions:
      actions: write
    steps:
      - name: Delete the cache entry saved by this run
        env:
          GH_TOKEN: ${{ github.token }}
          # This job checks nothing out, so there is no remote for gh to infer
          # the target repository from — without this it fails with
          # "failed to run git: fatal: not a git repository".
          GH_REPO: ${{ github.repository }}
          CACHE_KEY: ${{ needs.deps.outputs.cache-key }}
        run: |
          # Every gh call is checked. An unchecked failure here is invisible:
          # `gh cache list` then yields no ids, which is indistinguishable from
          # "the key does not exist", and that let a repo-context error pass as
          # a successful, empty cleanup.
          if ! ids=$(gh cache list --key "$CACHE_KEY" --limit 100 --json id --jq '.[].id'); then
            echo "::error::gh cache list failed for key $CACHE_KEY"
            exit 1
          fi
          # An empty result here is legitimate: `gh cache list` succeeded, so the
          # deps job simply never got as far as saving one.
          if [[ -z "$ids" ]]; then
            echo "No cache entry exists for key $CACHE_KEY"
            exit 0
          fi
          while read -r id; do
            echo "Deleting cache $id ($CACHE_KEY)"
            gh cache delete "$id"
          done <<< "$ids"
          # Assert the post-condition rather than trusting the delete calls: this
          # job exists to guarantee the entry is gone.
          remaining=$(gh cache list --key "$CACHE_KEY" --limit 100 --json id --jq '.[].id')
          if [[ -n "$remaining" ]]; then
            echo "::error::cache key $CACHE_KEY still present after delete (ids: $remaining)"
            exit 1
          fi
          echo "Deleted every cache entry for key $CACHE_KEY"
