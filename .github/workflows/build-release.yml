---
name: Build and Release

permissions:
  contents: write  # required for creating releases and uploading artifacts
  actions: read    # required for using actions/checkout, actions/cache, etc.

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main, master ]

jobs:
  deps:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.cache-key }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Compute key
        id: cache-key
        run: |
          echo "cache-key=${{ runner.os }}-deps-${{ hashFiles('dependencies.lock') }}" >> $GITHUB_OUTPUT

      - name: Restore cache (v5)
        id: cache-restore
        uses: actions/cache@v5
        with:
          path: |
            .venv
            .pio
            ~/.platformio/.cache
            ~/.platformio/lib
            ~/.npm
            web/node_modules
          key: ${{ steps.cache-key.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Create Python venv
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv

      - name: Activate venv and install PlatformIO
        run: |
          source .venv/bin/activate
          pip install --upgrade pip
          pip install --upgrade platformio intelhex

      - name: Install PlatformIO libraries (explicit)
        run: |
          source .venv/bin/activate
          pio pkg install

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: Install npm dependencies
        run: |
          npm ci

      - name: Cache Python venv, PlatformIO, and node_modules
        id: cache-save
        uses: actions/cache@v5
        with:
          path: |
            .venv
            .pio
            ~/.platformio/.cache
            ~/.platformio/lib
            ~/.npm
            web/node_modules
          key: ${{ steps.cache-key.outputs.cache-key }}

      - name: Show save outputs
        run: |
          echo "cache-save.cache-hit='${{ steps.cache-save.outputs.cache-hit }}'"
          echo "cache-save.cache-key='${{ steps.cache-save.outputs.cache-key }}'"

  build:
    needs: deps
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [esp32d, esp32c6, esp32, esp32c3, esp32s3]
    outputs:
      envs: ${{ toJson(matrix.env) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore PlatformIO dependencies
        id: cache-restore
        uses: actions/cache@v5
        with:
          path: |
            .venv
            .pio
            ~/.platformio/.cache
            ~/.platformio/lib
            ~/.npm
            web/node_modules
          key: ${{ needs.deps.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: Install npm dependencies
        run: |
          npm ci

      - name: Build firmware for ${{ matrix.env }} (with retry)
        run: |
          source .venv/bin/activate
          n=0
          until [ "$n" -ge 3 ]
          do
            platformio run -e ${{ matrix.env }} && break
            n=$((n+1))
            echo "Build failed, retrying ($n/3)..."
            sleep 10
          done
          if [ "$n" -ge 3 ]; then
            echo "Build failed after 3 attempts." >&2
            exit 1
          fi

      - name: Compress firmware binaries
        run: |
          find .pio/build/${{ matrix.env }} -type f -name '*.bin' -exec gzip -k -n {} \;

      - name: Rename .bin.gz files with env and version
        run: |
          VERSION=$(cat VERSION)
          # Ensure version always has 'v' prefix
          if [[ $VERSION != v* ]]; then
            VERSION="v$VERSION"
          fi
          for f in .pio/build/${{ matrix.env }}/*.bin.gz; do \
            BASE=$(basename "$f" .bin.gz); \
            mv "$f" ".pio/build/${{ matrix.env }}/${BASE}_${{ matrix.env }}_${VERSION}.bin.gz"; \
          done

      - name: Record built environment
        run: echo "${{ matrix.env }}" > built_envs_${{ matrix.env }}.txt

      - name: Upload build artifacts and env file for ${{ matrix.env }}
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/*.bin.gz
            built_envs_${{ matrix.env }}.txt

  manifest:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all build artifacts and env files
        uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: .pio/build

      - name: List built_envs files
        run: find . -name 'built_envs_*.txt' -exec ls -l {} \; || echo 'No built_envs_*.txt found'

      - name: Collect all unique envs
        id: collect_envs
        run: |
          find . -name 'built_envs_*.txt' -exec cat {} \; | sort | uniq | tr '\n' ' ' > all_envs.txt
          echo "ENVS=$(cat all_envs.txt)" >> $GITHUB_ENV

      - name: Set manifest environment variables
        run: |
          echo "FIRMWARE_TYPE=DeepGlow" >> $GITHUB_ENV
          echo "FIRMWARE_BASE_URL=https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/" >> $GITHUB_ENV

      - name: Generate manifest.json for OTA
        run: |
          VERSION=$(cat VERSION)
          # Ensure version always has 'v' prefix
          if [[ $VERSION != v* ]]; then
            VERSION="v$VERSION"
          fi
          FIRMWARE_TYPE="${FIRMWARE_TYPE:-DeepGlow}"
          BASE_URL="${FIRMWARE_BASE_URL:-https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/}"
          tmpfile=$(mktemp)
          echo '[' > "$tmpfile"
          first=1
          for ENV in $ENVS; do
            FILENAME="firmware_${ENV}_${VERSION}.bin.gz"
            [ $first -eq 0 ] && echo ',' >> "$tmpfile"
            echo "  {\"type\": \"${FIRMWARE_TYPE}\", \"env\": \"${ENV}\", \"version\": \"${VERSION}\", \"url\": \"${BASE_URL}${FILENAME}\"}" >> "$tmpfile"
            first=0
          done
          echo ']' >> "$tmpfile"
          cat "$tmpfile" | jq '.' > manifest.json
          rm "$tmpfile"
        env:
          FIRMWARE_TYPE: ${{ env.FIRMWARE_TYPE }}
          FIRMWARE_BASE_URL: ${{ env.FIRMWARE_BASE_URL }}
          ENVS: ${{ env.ENVS }}

      - name: Upload manifest.json
        uses: actions/upload-artifact@v7
        with:
          name: manifest-json
          path: manifest.json

  release:
    needs: [build, manifest]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: .pio/build

      - name: Download manifest.json
        uses: actions/download-artifact@v8
        with:
          name: manifest-json
          path: .

      - name: List files and modification times before release
        run: |
          echo "Listing firmware files before release:"
          find .pio/build -type f -name '*.bin.gz' -exec ls -lh {} +
          echo "Listing manifest.json before release:"
          ls -lh manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            .pio/build/**/*.bin.gz
            manifest.json
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
