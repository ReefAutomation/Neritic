---
name: Pull Request CI

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main

# The reusable CI deletes its dependency cache when it ends, which needs
# `actions: write`. A caller that declares no permissions caps the called
# workflow at the repository defaults, so the scope is granted explicitly here.
permissions:
  contents: read
  actions: write

jobs:
  build:
    if: ${{ github.actor == 'renovate[bot]' && github.event.pull_request.state != 'closed' }}
    uses: ./.github/workflows/ci-workflow.yml
    with:
      run_web: true
      run_firmware: true
